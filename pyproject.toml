[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortana-agent"
version = "0.1.0"
description = "Local-first real-time voice assistant"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Cortana Team"}]
dependencies = [
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "python-dotenv>=1.0.1",
  "structlog>=24.1.0",
  "orjson>=3.10.7",
  "aiofiles>=24.1.0",
  "httpx>=0.27.0",
  "openai>=1.51.0",
  "rapidfuzz>=3.9.7",
  "numpy>=1.26.4",
]

[project.optional-dependencies]
audio = [
  "faster-whisper>=1.0.3",
  "sounddevice>=0.4.7",
  "webrtcvad-wheels>=2.0.14",
]
local-llm = [
  "llama-cpp-python>=0.3.1",
]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.7",
  "mypy>=1.11.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=src/cortana --cov-report=term-missing --cov-fail-under=90"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
exclude = ["tests/"]

[tool.coverage.run]
omit = [
  "src/cortana/__main__.py",
  "src/cortana/app.py",
  "src/cortana/audio/stt.py",
  "src/cortana/audio/tts.py",
]
